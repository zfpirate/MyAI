name: Build and publish Windows app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and attach to its release
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run unit tests
        run: python -m unittest discover -q

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python -c "import os; from core.app_info import APP_VERSION; expected = os.environ['RELEASE_TAG'].removeprefix('v'); raise SystemExit(0 if APP_VERSION == expected else f'APP_VERSION {APP_VERSION} must match tag {expected}')"

      - name: Build Windows application
        run: .\build_windows.ps1

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          $release = gh release view $env:RELEASE_TAG --json tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              dist/CAPRI-windows-x64.zip `
              dist/CAPRI-windows-x64.zip.sha256 `
              --title "CAPRI $env:RELEASE_TAG" `
              --generate-notes `
              --notes "Téléchargez et extrayez le paquet Windows, puis lancez CAPRI.exe. Ollama et le modèle qwen3:8b sont requis. Les mises à jour peuvent ensuite être installées directement depuis CAPRI."
          }
          else {
            gh release upload $env:RELEASE_TAG `
              dist/CAPRI-windows-x64.zip `
              dist/CAPRI-windows-x64.zip.sha256 `
              --clobber
          }
